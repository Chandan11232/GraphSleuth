[project]
name = "codebase-detective"
version = "2.0.0"
description = "Bug-investigation agent that reasons over a FalkorDB code graph"
requires-python = ">=3.11"

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"
exclude = ["venv"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
